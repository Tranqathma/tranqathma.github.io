name: Telegram crew sync

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: telegram-crew-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-crew:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --upgrade pip pillow

      - name: Run Telegram collector
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python3 agents/crew.py

      - name: Rebuild website
        run: python3 build/generate.py

      - name: Commit Telegram and website updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/crew.json data/crew_state.json

          if [ -d crew ]; then
            git add crew
          fi

          git add -- '*.html' '*.css' 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No Telegram or website changes to commit."
            exit 0
          fi

          git commit -m "Sync Telegram crew feed and rebuild website"

          git pull --rebase origin main
          git push origin HEAD:main
